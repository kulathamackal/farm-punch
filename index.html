<!doctype html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f43">
<title>Farm Punch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--g:#1f6f43;--bg:#eef2f6;--ink:#202124;--mut:#5f6368;--line:#dadce0;--red:#c62828;--amb:#ef6c00;--blue:#0277bd}
*{box-sizing:border-box}
body{margin:0;font-family:Roboto,"Noto Sans","Noto Sans Malayalam",sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
.top{background:var(--g);color:#fff;padding:12px 14px 10px;position:sticky;top:0;z-index:5}
.top h1{margin:0;font-size:18px}
.st{margin-top:6px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.18);border-radius:12px;padding:2px 9px}
.pill.w{background:#ffb74d;color:#3e2723}.pill.e{background:#ef9a9a;color:#3e0000}
.wrap{padding:10px;max-width:560px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.h{font-weight:700;font-size:15px}
.note{font-size:13px;color:var(--mut);line-height:1.4}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.seg button{border:1px solid #bbb;background:#fff;border-radius:18px;padding:8px 12px;font:inherit;font-size:14px;font-weight:600}
.seg button.on{background:var(--g);border-color:var(--g);color:#fff}
.w{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid #eee}
.w .n{flex:1;min-width:0}.w .n b{display:block;font-size:16px}.w .n span{font-size:13px;color:var(--mut)}
.btn{border:none;border-radius:10px;padding:12px 14px;font:inherit;font-size:15px;font-weight:700;color:#fff;background:var(--g);min-width:72px}
.btn.out{background:var(--blue)}.btn.gray{background:#90a4ae}.btn.red{background:var(--red)}.btn.amb{background:var(--amb)}
.btn:disabled{opacity:.45}
.full{width:100%;margin-top:8px}
input{font:inherit;font-size:20px;padding:10px;border-radius:8px;border:1px solid #bbb;width:100%;letter-spacing:2px;text-align:center}
.q{font-size:14px;padding:7px 0;border-top:1px solid #eee;display:flex;gap:8px;align-items:center}.q span{flex:1}
.q button{border:1px solid #bbb;background:#fff;border-radius:8px;padding:6px 9px;font:inherit;font-size:13px}
.ok{color:var(--g);font-weight:600}.er{color:var(--red);font-weight:600}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
#modal .box{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px;max-height:92vh;overflow:auto}
a{color:var(--g)}
</style>
</head>
<body>
<div class="top"><h1>👷 ഹാജർ · Farm Punch</h1><div class="st" id="st"></div></div>
<div class="wrap" id="app"></div>
<div id="modal"><div class="box" id="mbox"></div></div>
<input type="file" id="cam" accept="image/*" capture="user" style="display:none">
<script src="app.js"></script>
</body>
</html>
